name: Act 0 Godot CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-act0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          curl -L --fail --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse and import project
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-parse.log
          ! grep -q "SCRIPT ERROR:" /tmp/godot-parse.log

      - name: Run Act 0 deterministic tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_state_tests.gd 2>&1 | tee /tmp/act0-state.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-state.log

      - name: Run save backup corruption recovery
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/save_manager_io_tests.gd 2>&1 | tee /tmp/save-manager-io.log
          ! grep -q "SCRIPT ERROR:" /tmp/save-manager-io.log

      - name: Run Chapter 0 combat fixture parity
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/ch00_combat_fixture_tests.gd 2>&1 | tee /tmp/ch00-combat-fixtures.log
          ! grep -q "SCRIPT ERROR:" /tmp/ch00-combat-fixtures.log

      - name: Run pre-Temple playable adapter tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/ch00_pretemple_controller_tests.gd 2>&1 | tee /tmp/ch00-pretemple-controller.log
          ! grep -q "SCRIPT ERROR:" /tmp/ch00-pretemple-controller.log

      - name: Probe all Catacomb weapon-family paths
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_catacomb_playability_tests.gd 2>&1 | tee /tmp/act0-catacomb-playability.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-catacomb-playability.log

      - name: Run Act 0 scene smoke
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_scene_smoke.gd 2>&1 | tee /tmp/act0-scene.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-scene.log
