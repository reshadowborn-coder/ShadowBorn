name: Act 0 Godot CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-act0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          curl -L --fail --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse and import project
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-parse.log
          ! grep -q "SCRIPT ERROR:" /tmp/godot-parse.log

      - name: Run Act 0 deterministic tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_state_tests.gd 2>&1 | tee /tmp/act0-state.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-state.log

      - name: Validate Act 0 combat content data
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_content_validation_tests.gd 2>&1 | tee /tmp/act0-content-validation.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-content-validation.log

      - name: Run save backup corruption recovery
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/save_manager_io_tests.gd 2>&1 | tee /tmp/save-manager-io.log
          ! grep -q "SCRIPT ERROR:" /tmp/save-manager-io.log

      - name: Run Chapter 0 combat fixture parity
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/ch00_combat_fixture_tests.gd 2>&1 | tee /tmp/ch00-combat-fixtures.log
          ! grep -q "SCRIPT ERROR:" /tmp/ch00-combat-fixtures.log

      - name: Run pre-Temple playable adapter tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/ch00_pretemple_controller_tests.gd 2>&1 | tee /tmp/ch00-pretemple-controller.log
          ! grep -q "SCRIPT ERROR:" /tmp/ch00-pretemple-controller.log

      - name: Run combat trace schema tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/combat_frame_trace_tests.gd 2>&1 | tee /tmp/combat-frame-trace.log
          ! grep -q "SCRIPT ERROR:" /tmp/combat-frame-trace.log

      - name: Validate Android QA export preset
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/android_qa_export_preset_tests.gd 2>&1 | tee /tmp/android-qa-export-preset.log
          ! grep -q "SCRIPT ERROR:" /tmp/android-qa-export-preset.log

      - name: Validate iPhone runtime and export policy
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/ios_iphone_policy_tests.gd 2>&1 | tee /tmp/ios-iphone-policy.log
          ! grep -q "SCRIPT ERROR:" /tmp/ios-iphone-policy.log

      - name: Run performance and visual consistency regressions
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/perf_visual_consistency_tests.gd 2>&1 | tee /tmp/perf-visual-consistency.log
          ! grep -q "SCRIPT ERROR:" /tmp/perf-visual-consistency.log

      - name: Validate turn-first combat effect contracts
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/combat_effect_contract_tests.gd 2>&1 | tee /tmp/combat-effect-contracts.log
          ! grep -q "SCRIPT ERROR:" /tmp/combat-effect-contracts.log

      - name: Audit starter weapon visual contract
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/starter_weapon_visual_contract_tests.gd 2>&1 | tee /tmp/starter-weapon-visual-contract.log
          ! grep -q "SCRIPT ERROR:" /tmp/starter-weapon-visual-contract.log

      - name: Probe all Catacomb weapon-family paths
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_catacomb_playability_tests.gd 2>&1 | tee /tmp/act0-catacomb-playability.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-catacomb-playability.log

      - name: Run Act 0 scene smoke
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_scene_smoke.gd 2>&1 | tee /tmp/act0-scene.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-scene.log

      - name: Validate Chapter 0 enemy ecology cues
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act0_enemy_ecology_tests.gd 2>&1 | tee /tmp/act0-enemy-ecology.log
          ! grep -q "SCRIPT ERROR:" /tmp/act0-enemy-ecology.log

      - name: Validate living Temple NPC presentation
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/temple_npc_animation_tests.gd 2>&1 | tee /tmp/temple-npc-animation.log
          ! grep -q "SCRIPT ERROR:" /tmp/temple-npc-animation.log

      - name: Validate Temple milestone memory
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/temple_memory_state_tests.gd 2>&1 | tee /tmp/temple-memory-state.log
          ! grep -q "SCRIPT ERROR:" /tmp/temple-memory-state.log

      - name: Run Act 1.1 deterministic progression tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act1_state_tests.gd 2>&1 | tee /tmp/act1-state.log
          ! grep -q "SCRIPT ERROR:" /tmp/act1-state.log

      - name: Run Act 1.1 sewer and Temple scene smoke
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act1_scene_smoke.gd 2>&1 | tee /tmp/act1-scene.log
          ! grep -q "SCRIPT ERROR:" /tmp/act1-scene.log

      - name: Validate Act 1 iOS suspend recovery
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act1_suspend_recovery_tests.gd 2>&1 | tee /tmp/act1-suspend-recovery.log
          ! grep -q "SCRIPT ERROR:" /tmp/act1-suspend-recovery.log

      - name: Run Act 1 Poison Rat behavior test
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act1_poison_behavior_tests.gd 2>&1 | tee /tmp/act1-poison.log
          ! grep -q "SCRIPT ERROR:" /tmp/act1-poison.log

      - name: Enforce Act 1.1 iPhone runtime budgets
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/act1_ios_runtime_budget_tests.gd 2>&1 | tee /tmp/act1-ios-runtime-budget.log
          ! grep -q "SCRIPT ERROR:" /tmp/act1-ios-runtime-budget.log

      - name: Enforce iPhone runtime scene budgets
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/ios_runtime_budget_tests.gd 2>&1 | tee /tmp/ios-runtime-budget.log
          ! grep -q "SCRIPT ERROR:" /tmp/ios-runtime-budget.log

      - name: Enforce iPhone source asset budgets
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/ios_asset_budget_tests.gd 2>&1 | tee /tmp/ios-asset-budget.log
          ! grep -q "SCRIPT ERROR:" /tmp/ios-asset-budget.log

  android-qa-apk:
    needs: headless-act0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Install Godot 4.4.1 export templates
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

      - name: Install Godot 4.4 Android SDK requirements
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Configure Godot Android editor settings
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$JAVA_HOME/bin/java"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/shadowborn-qa-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          grep -q "export/android/android_sdk_path" "$HOME/.config/godot/editor_settings-4.tres"
          grep -q "export/android/java_sdk_path" "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create CI debug keystore
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME/bin/keytool"
          "$JAVA_HOME/bin/keytool" \
            -genkeypair \
            -keystore /tmp/shadowborn-qa-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Shadowborn QA,C=IT" \
            -deststoretype PKCS12
          test -s /tmp/shadowborn-qa-debug.keystore

      - name: Export Android QA debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/shadowborn-qa-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build/android
          /tmp/godot/godot --verbose --headless --path . \
            --export-debug "Android QA" build/android/Shadowborn-Act0-QA.apk \
            2>&1 | tee /tmp/android-qa-export.log
          ! grep -q "SCRIPT ERROR:" /tmp/android-qa-export.log
          test -s build/android/Shadowborn-Act0-QA.apk

      - name: Verify Android QA APK contract
        run: |
          set -euo pipefail
          APK=build/android/Shadowborn-Act0-QA.apk
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK" | tr -d '\r\n')"
          printf '%s\n' "$PACKAGE_ID" | tee build/android/apk-package-id.txt
          test "$PACKAGE_ID" = "org.shadowborn.chapter0.qa"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > build/android/apk-badging.txt 2>&1 || true
          zipinfo -1 "$APK" > build/android/apk-files.txt
          grep -q '^lib/arm64-v8a/' build/android/apk-files.txt
          ! grep -q '^lib/armeabi-v7a/' build/android/apk-files.txt
          ! grep -q '^lib/x86/' build/android/apk-files.txt
          ! grep -q '^lib/x86_64/' build/android/apk-files.txt
          sha256sum "$APK" | tee build/android/Shadowborn-Act0-QA.apk.sha256
          APK_SHA256="$(cut -d ' ' -f1 build/android/Shadowborn-Act0-QA.apk.sha256)"
          cat > build/android/qa-build-manifest.txt <<EOF
          repository=reshadowborn-coder/ShadowBorn
          git_sha=$GITHUB_SHA
          workflow_run_id=$GITHUB_RUN_ID
          workflow_run_attempt=$GITHUB_RUN_ATTEMPT
          godot_version=4.4.1
          android_package=org.shadowborn.chapter0.qa
          android_abi=arm64-v8a
          apk_sha256=$APK_SHA256
          trace_capability=SB_TRACE
          EOF
          grep -q "^git_sha=$GITHUB_SHA$" build/android/qa-build-manifest.txt
          grep -q "^apk_sha256=$APK_SHA256$" build/android/qa-build-manifest.txt

      - name: Upload Android QA APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowborn-act0-android-qa
          path: |
            build/android/Shadowborn-Act0-QA.apk
            build/android/Shadowborn-Act0-QA.apk.sha256
            build/android/apk-badging.txt
            build/android/apk-package-id.txt
            build/android/qa-build-manifest.txt
          if-no-files-found: error
          retention-days: 7

  iphone-xcode-project:
    needs: headless-act0
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip
          rm -rf /tmp/godot-macos
          mkdir -p /tmp/godot-macos
          unzip -q /tmp/godot.zip -d /tmp/godot-macos
          chmod +x /tmp/godot-macos/Godot.app/Contents/MacOS/Godot
          /tmp/godot-macos/Godot.app/Contents/MacOS/Godot --version

      - name: Install Godot 4.4.1 export templates
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/ios.zip"

      - name: Inject CI-only iPhone Team ID
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          text = p.read_text()
          needle = 'application/app_store_team_id=""'
          if needle not in text:
              raise SystemExit("iPhone Team ID placeholder missing")
          p.write_text(text.replace(needle, 'application/app_store_team_id="ABCDE12345"', 1))
          PY
          grep -Fq 'application/app_store_team_id="ABCDE12345"' export_presets.cfg

      - name: Export iPhone QA Xcode project
        run: |
          set -euo pipefail
          rm -rf build/ios
          mkdir -p build/ios
          set -o pipefail
          /tmp/godot-macos/Godot.app/Contents/MacOS/Godot --verbose --headless --path . \
            --export-debug "iPhone QA" build/ios/Shadowborn-Act0-iPhone-QA.zip \
            2>&1 | tee /tmp/iphone-xcode-export.log
          ! grep -Fq "SCRIPT ERROR:" /tmp/iphone-xcode-export.log
          ! grep -Fq "Project export for preset \"iPhone QA\" failed" /tmp/iphone-xcode-export.log
          ! grep -Fq "Storing File: res://tests/" /tmp/iphone-xcode-export.log
          test -f build/ios/Shadowborn-Act0-iPhone-QA.xcodeproj/project.pbxproj
          test -f build/ios/Shadowborn-Act0-iPhone-QA/Shadowborn-Act0-iPhone-QA-Info.plist

      - name: Verify iPhone Xcode project contract
        run: |
          set -euo pipefail
          XCODEPROJ="build/ios/Shadowborn-Act0-iPhone-QA.xcodeproj"
          SCHEME_FILE="$(find "$XCODEPROJ/xcshareddata/xcschemes" -type f -name '*.xcscheme' -print -quit)"
          test -n "$SCHEME_FILE"
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -showBuildSettings > /tmp/iphone-build-settings.txt
          grep -E 'TARGETED_DEVICE_FAMILY|IPHONEOS_DEPLOYMENT_TARGET|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|ASSETCATALOG_COMPILER_APPICON_NAME' /tmp/iphone-build-settings.txt
          grep -Fq 'TARGETED_DEVICE_FAMILY = 1' /tmp/iphone-build-settings.txt
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET = 16.0' /tmp/iphone-build-settings.txt
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = org.shadowborn.chapter0.qa' /tmp/iphone-build-settings.txt
          grep -Fq 'DEVELOPMENT_TEAM = ABCDE12345' /tmp/iphone-build-settings.txt
          grep -Fq 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon' /tmp/iphone-build-settings.txt
          APPICON="$(find build/ios/Shadowborn-Act0-iPhone-QA/Images.xcassets -type d -name '*.appiconset' -print -quit)"
          test -n "$APPICON"
          test -f "$APPICON/Contents.json"
          test -f build/ios/PrivacyInfo.xcprivacy
          test -f build/ios/Shadowborn-Act0-iPhone-QA/Images.xcassets/SplashImage.imageset/splash@2x.png
          test -f build/ios/Shadowborn-Act0-iPhone-QA/Images.xcassets/SplashImage.imageset/splash@3x.png

      - name: Compile unsigned iPhone QA app
        run: |
          set -euo pipefail
          XCODEPROJ="build/ios/Shadowborn-Act0-iPhone-QA.xcodeproj"
          SCHEME_FILE="$(find "$XCODEPROJ/xcshareddata/xcschemes" -type f -name '*.xcscheme' -print -quit)"
          test -n "$SCHEME_FILE"
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          rm -rf build/ios/DerivedData
          set -o pipefail
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/iphone-xcodebuild.log
          grep -Fq "** BUILD SUCCEEDED **" /tmp/iphone-xcodebuild.log
          APP="$(find build/ios/DerivedData/Build/Products -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          test -f "$APP/$EXECUTABLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "org.shadowborn.chapter0.qa"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "16.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP/Info.plist")" = "Launch Screen"
          /usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$APP/Info.plist" | tee /tmp/iphone-required-capabilities.txt
          grep -Fq "iphone-ipad-minimum-performance-a12" /tmp/iphone-required-capabilities.txt
          ! grep -Fq "iphone-performance-gaming-tier" /tmp/iphone-required-capabilities.txt
          test -f "$APP/PrivacyInfo.xcprivacy"
          if /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$APP/Info.plist" >/dev/null 2>&1; then
            echo "Unexpected second device family: build is not iPhone-only" >&2
            exit 1
          fi

      - name: Export and compile unsigned iPhone Release app
        run: |
          set -euo pipefail
          rm -rf build/ios-release
          mkdir -p build/ios-release
          set -o pipefail
          /tmp/godot-macos/Godot.app/Contents/MacOS/Godot --verbose --headless --path . \
            --export-release "iPhone QA" build/ios-release/Shadowborn-Act0-iPhone-Release.zip \
            2>&1 | tee /tmp/iphone-release-export.log
          ! grep -Fq "SCRIPT ERROR:" /tmp/iphone-release-export.log
          ! grep -Fq "Project export for preset \"iPhone QA\" failed" /tmp/iphone-release-export.log
          ! grep -Fq "Storing File: res://tests/" /tmp/iphone-release-export.log
          XCODEPROJ="build/ios-release/Shadowborn-Act0-iPhone-Release.xcodeproj"
          test -f "$XCODEPROJ/project.pbxproj"
          SCHEME_FILE="$(find "$XCODEPROJ/xcshareddata/xcschemes" -type f -name '*.xcscheme' -print -quit)"
          test -n "$SCHEME_FILE"
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-release/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/iphone-release-xcodebuild.log
          grep -Fq "** BUILD SUCCEEDED **" /tmp/iphone-release-xcodebuild.log
          RELEASE_APP="$(find build/ios-release/DerivedData/Build/Products -type d -name '*.app' -print -quit)"
          test -n "$RELEASE_APP"
          test -f "$RELEASE_APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RELEASE_APP/Info.plist")" = "org.shadowborn.chapter0.qa"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$RELEASE_APP/Info.plist")" = "16.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$RELEASE_APP/Info.plist")" = "1"
          /usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$RELEASE_APP/Info.plist" | tee /tmp/iphone-release-required-capabilities.txt
          grep -Fq "iphone-ipad-minimum-performance-a12" /tmp/iphone-release-required-capabilities.txt
          ! grep -Fq "iphone-performance-gaming-tier" /tmp/iphone-release-required-capabilities.txt
          test -f "$RELEASE_APP/PrivacyInfo.xcprivacy"

      - name: Package iPhone QA Xcode artifact
        run: |
          set -euo pipefail
          rm -f build/ios/Shadowborn-Act0-iPhone-Xcode-QA.zip
          test -d build/ios/Shadowborn-Act0-iPhone-QA.xcframework
