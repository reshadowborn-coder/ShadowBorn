name: Act 0 Godot CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-act0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          curl -L --fail --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse and import project
        run: /tmp/godot/godot --headless --path . --editor --quit

      - name: Run Act 0 deterministic tests
        run: /tmp/godot/godot --headless --path . --script res://tests/act0_state_tests.gd

      - name: Run Chapter 0 combat fixture parity
        run: /tmp/godot/godot --headless --path . --script res://tests/ch00_combat_fixture_tests.gd

      - name: Run Act 0 scene smoke
        run: /tmp/godot/godot --headless --path . --script res://tests/act0_scene_smoke.gd
