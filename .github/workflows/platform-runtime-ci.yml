name: Platform Runtime CI

on:
  pull_request:
    paths:
      - "scripts/platform/**"
      - "scripts/world/chapter00_game.gd"
      - "tests/platform_runtime_service_tests.gd"
      - "tests/ios_iphone_policy_tests.gd"
      - "project.godot"
      - ".github/workflows/platform-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/platform/**"
      - "scripts/world/chapter00_game.gd"
      - "tests/platform_runtime_service_tests.gd"
      - "tests/ios_iphone_policy_tests.gd"
      - "project.godot"
      - ".github/workflows/platform-runtime-ci.yml"

jobs:
  platform-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot 4.4.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project with PlatformRuntime autoload
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --editor --quit-after 2 2>&1 | tee /tmp/platform-runtime-parse.log
          ! grep -q "SCRIPT ERROR:" /tmp/platform-runtime-parse.log

      - name: Validate centralized runtime policy
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --script res://tests/platform_runtime_service_tests.gd 2>&1 | tee /tmp/platform-runtime-test.log
          ! grep -q "SCRIPT ERROR:" /tmp/platform-runtime-test.log
