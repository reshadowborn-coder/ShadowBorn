name: Shadowborn Hound DCC Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/blender/grave_hound_rig_smoke.py"
      - "tools/blender/grave_hound_mesh_candidate.py"
      - ".github/workflows/dcc-hound-smoke.yml"
      - "docs/art/GRAVE_HOUND_PRODUCTION_BRIEF.md"
      - "tests/dcc_hound_generated_glb_test.gd"
      - "tests/dcc_hound_mesh_candidate_test.gd"
      - "tests/dcc_hound_candidate_capture.gd"
      - "tests/dcc_hound_gameplay_camera_capture.gd"

jobs:
  blender-rig-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Blender 5.2.2 LTS
        run: |
          set -euo pipefail
          cd /tmp
          curl -L --fail --retry 3 -O https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -L --fail --retry 3 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep "blender-5.2.2-linux-x64.tar.xz" blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz

      - name: Run compact quadruped game-rig to GLB round-trip smoke
        run: |
          set -euo pipefail
          mkdir -p build/dcc_hound
          /tmp/blender-5.2.2-linux-x64/blender             -b --factory-startup             --python tools/blender/grave_hound_rig_smoke.py             -- --out-dir build/dcc_hound 2>&1 | tee /tmp/hound_dcc.log
          grep -q "SHADOWBORN_DCC_SMOKE_PASS" /tmp/hound_dcc.log
          test -s build/dcc_hound/grave_hound_game_rig_smoke.blend
          test -s build/dcc_hound/grave_hound_game_rig_smoke.glb
          test -s build/dcc_hound/grave_hound_rig_smoke_report.json

      - name: Build first original Hound mesh candidate
        run: |
          set -euo pipefail
          /tmp/blender-5.2.2-linux-x64/blender \
            -b --factory-startup \
            --python tools/blender/grave_hound_mesh_candidate.py \
            -- --out-dir build/dcc_hound 2>&1 | tee /tmp/hound_mesh_candidate.log
          grep -q "SHADOWBORN_HOUND_MESH_CANDIDATE_PASS" /tmp/hound_mesh_candidate.log
          test -s build/dcc_hound/grave_hound_mesh_candidate.blend
          test -s build/dcc_hound/grave_hound_mesh_candidate.glb
          test -s build/dcc_hound/grave_hound_mesh_candidate_report.json

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Import generated game rig in Godot 4.7.2
        run: |
          set -euo pipefail
          # Keep the .blend artifact out of Godot's filesystem scan; this gate is
          # specifically validating the generated GLB import contract.
          mv build/dcc_hound/grave_hound_game_rig_smoke.blend /tmp/grave_hound_game_rig_smoke.blend
          mv build/dcc_hound/grave_hound_mesh_candidate.blend /tmp/grave_hound_mesh_candidate.blend
          /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee /tmp/hound_godot_import.log
          ! grep -q "SCRIPT ERROR:" /tmp/hound_godot_import.log
          /tmp/godot/godot --headless --path . --script res://tests/dcc_hound_generated_glb_test.gd 2>&1 | tee /tmp/hound_godot_test.log
          grep -q "Shadowborn generated Hound GLB Godot import: PASS" /tmp/hound_godot_test.log
          /tmp/godot/godot --headless --path . --script res://tests/dcc_hound_mesh_candidate_test.gd 2>&1 | tee /tmp/hound_mesh_candidate_godot_test.log
          grep -q "Shadowborn original Hound mesh candidate Godot import: PASS" /tmp/hound_mesh_candidate_godot_test.log
          mv /tmp/grave_hound_game_rig_smoke.blend build/dcc_hound/grave_hound_game_rig_smoke.blend
          mv /tmp/grave_hound_mesh_candidate.blend build/dcc_hound/grave_hound_mesh_candidate.blend

      - name: Prepare virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Capture original Hound candidate side silhouettes
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/godot --path . --rendering-method gl_compatibility \
            --script res://tests/dcc_hound_candidate_capture.gd 2>&1 | tee /tmp/hound_candidate_capture.log
          grep -q "SHADOWBORN_HOUND_CANDIDATE_CAPTURE_PASS" /tmp/hound_candidate_capture.log
          test -s build/dcc_hound/captures/hound_candidate_idle_side.png
          test -s build/dcc_hound/captures/hound_candidate_bite_windup.png
          test -s build/dcc_hound/captures/hound_candidate_bite_contact.png
          test -s build/dcc_hound/captures/hound_candidate_bite_recovery.png

      - name: Capture candidate from exact battle camera contract
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/godot --path . --rendering-method gl_compatibility \
            --script res://tests/dcc_hound_gameplay_camera_capture.gd 2>&1 | tee /tmp/hound_gameplay_camera.log
          grep -q "SHADOWBORN_HOUND_GAMEPLAY_CAMERA_CAPTURE_PASS" /tmp/hound_gameplay_camera.log
          test -s build/dcc_hound/captures/hound_candidate_battle_neutral_pbr_idle.png
          test -s build/dcc_hound/captures/hound_candidate_battle_flat_gray_idle.png
          test -s build/dcc_hound/captures/hound_candidate_battle_silhouette_idle.png
          test -s build/dcc_hound/captures/hound_candidate_battle_neutral_pbr_contact.png
          test -s build/dcc_hound/captures/hound_candidate_battle_flat_gray_contact.png
          test -s build/dcc_hound/captures/hound_candidate_battle_silhouette_contact.png

      - name: Upload DCC smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grave-hound-dcc-smoke
          path: build/dcc_hound/
          if-no-files-found: error
          retention-days: 14
