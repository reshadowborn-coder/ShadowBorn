name: Shadowborn Visual Capture

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "scripts/presentation/**"
      - "tests/visual_capture_test.gd"
      - ".github/workflows/visual-capture.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
      - name: Import assets
        run: |
          /tmp/godot/godot --headless --path . --editor --quit
      - name: Prepare virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Capture presentation frames
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot --path . --rendering-method gl_compatibility --script res://tests/visual_capture_test.gd
      - name: Upload visual captures
        uses: actions/upload-artifact@v4
        with:
          name: shadowborn-visual-capture
          path: /tmp/shadowborn-visual/*.png
          if-no-files-found: error
          retention-days: 14
