name: Acquire Checkpoint 01 Cobble PBR

on:
  push:
    branches:
      - chatgpt/material-cobble-acquire
    paths:
      - .github/workflows/acquire-cobble-temp.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/material-cobble-acquire
      - name: Acquire approved CC0 PBR maps
        run: python3 tools/acquire_polyhaven_texture.py
      - name: Verify production files
        run: |
          test -s assets/production/materials/cemetery_wet_cobble/cobblestone_01_diff_2k.png
          test -s assets/production/materials/cemetery_wet_cobble/cobblestone_01_nor_gl_2k.png
          test -s assets/production/materials/cemetery_wet_cobble/cobblestone_01_arm_2k.png
          test -s assets/production/materials/cemetery_wet_cobble/SOURCE.json
          python3 -m json.tool assets/production/materials/cemetery_wet_cobble/SOURCE.json >/dev/null
      - name: Commit acquired maps with provenance
        run: |
          git config user.name "shadowborn-production-bot"
          git config user.email "re.shadowborn@gmail.com"
          git add assets/production/materials/cemetery_wet_cobble
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "art: add CC0 cemetery wet cobble PBR"
          git push origin HEAD:chatgpt/material-cobble-acquire
