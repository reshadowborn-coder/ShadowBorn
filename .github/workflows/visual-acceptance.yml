name: Shadowborn Visual Acceptance

on:
  workflow_dispatch:

jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHADOWBORN_VISUAL_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
      - name: Parse and import
        run: /tmp/godot/godot --headless --path . --editor --quit
      - name: Production visual asset contract
        run: /tmp/godot/godot --headless --path . --script res://tests/visual_acceptance_assets_test.gd
