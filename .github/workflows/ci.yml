name: Shadowborn Core CI

on:
  push:
    branches: [main, "reboot/**"]
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
      - name: Parse and import
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee /tmp/parse.log
          ! grep -q "SCRIPT ERROR:" /tmp/parse.log
      - name: Python asset tool syntax
        run: |
          python3 -m py_compile tools/acquire_polyhaven_texture.py
      - name: Combat rules
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/combat_rules_test.gd
      - name: Asset pipeline
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/asset_pipeline_test.gd
      - name: Material pipeline
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/material_pipeline_test.gd
      - name: Environment mesh pipeline
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/environment_mesh_pipeline_test.gd
      - name: Visual asset policy
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/visual_asset_policy_test.gd
      - name: Production manifest contract
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/production_manifest_contract_test.gd
      - name: Environment preview integration
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/environment_preview_integration_test.gd
      - name: Presentation budget
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/presentation_budget_test.gd
      - name: Presentation orientation
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/presentation_orientation_test.gd
      - name: Weapon proportion probe
        run: |
          /tmp/godot/godot --headless --path . --script res://tests/weapon_proportion_probe_test.gd
